<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1240" viewBox="0 0 960 1240" role="img" aria-labelledby="title desc"><title id="title">一次 RAG 回答，经历了什么？</title><desc id="desc">先准备可检索的资料，再为每个问题挑选证据。</desc><rect x="0" y="0" width="960" height="1240" rx="0" fill="#fffcf8" stroke="#fffcf8" stroke-width="2"/><text x="40" y="35" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">一次 RAG 回答，经历了什么？</text><text x="40" y="89" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">先准备可检索的资料，再为每个问题挑选证据。</text><text x="40" y="145" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">01  建库 · 资料接入或更新时</text><rect x="40" y="200" width="190" height="105" rx="15" fill="#faecdc" stroke="#e7dacc" stroke-width="2"/><text x="135.0" y="215" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">原始文档</text><text x="135.0" y="257" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">PDF / Word / 网页</text><polyline points="230,252 265,252" fill="none" stroke="#bf682a" stroke-width="3" stroke-linejoin="round"/><polygon points="265,252 253.2941876694152,257.654551943446 253.2941876694152,246.345448056554" fill="#bf682a"/><rect x="270" y="200" width="190" height="105" rx="15" fill="#faecdc" stroke="#e7dacc" stroke-width="2"/><text x="365.0" y="215" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">解析文本</text><text x="365.0" y="257" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">提取正文与结构</text><polyline points="460,252 495,252" fill="none" stroke="#bf682a" stroke-width="3" stroke-linejoin="round"/><polygon points="495,252 483.2941876694152,257.654551943446 483.2941876694152,246.345448056554" fill="#bf682a"/><rect x="500" y="200" width="190" height="105" rx="15" fill="#faecdc" stroke="#e7dacc" stroke-width="2"/><text x="595.0" y="215" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">切成 Chunk</text><text x="595.0" y="257" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">保留局部语义</text><polyline points="690,252 725,252" fill="none" stroke="#bf682a" stroke-width="3" stroke-linejoin="round"/><polygon points="725,252 713.2941876694152,257.654551943446 713.2941876694152,246.345448056554" fill="#bf682a"/><rect x="730" y="200" width="190" height="105" rx="15" fill="#faecdc" stroke="#e7dacc" stroke-width="2"/><text x="825.0" y="215" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">Embedding</text><text x="825.0" y="257" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">片段 → 向量</text><polyline points="825,305 825,330 480,330 480,353" fill="none" stroke="#bf682a" stroke-width="3" stroke-linejoin="round"/><polygon points="480,353 474.345448056554,341.2941876694152 485.654551943446,341.2941876694152" fill="#bf682a"/><rect x="155" y="355" width="650" height="100" rx="15" fill="#e9f3ef" stroke="#e7dacc" stroke-width="2"/><text x="480.0" y="370" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">知识库 / 索引</text><text x="480.0" y="412" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">保存：片段原文 + 向量 + 来源元数据</text><polyline points="40,492 920,492" fill="none" stroke="#e7dacc" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 7"/><text x="40" y="515" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">02  问答 · 每次提问时</text><rect x="40" y="580" width="190" height="105" rx="15" fill="#e9f3ef" stroke="#e7dacc" stroke-width="2"/><text x="135.0" y="595" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">用户问题</text><text x="135.0" y="637" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">保留原始问题</text><polyline points="230,632 265,632" fill="none" stroke="#357c78" stroke-width="3" stroke-linejoin="round"/><polygon points="265,632 253.2941876694152,637.654551943446 253.2941876694152,626.345448056554" fill="#357c78"/><rect x="270" y="580" width="190" height="105" rx="15" fill="#e9f3ef" stroke="#e7dacc" stroke-width="2"/><text x="365.0" y="595" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">问题编码</text><text x="365.0" y="637" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">问题 → 向量</text><polyline points="460,632 495,632" fill="none" stroke="#357c78" stroke-width="3" stroke-linejoin="round"/><polygon points="495,632 483.2941876694152,637.654551943446 483.2941876694152,626.345448056554" fill="#357c78"/><rect x="500" y="580" width="190" height="105" rx="15" fill="#e9f3ef" stroke="#e7dacc" stroke-width="2"/><text x="595.0" y="595" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">Retriever</text><text x="595.0" y="637" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">查询已有索引</text><polyline points="690,632 725,632" fill="none" stroke="#357c78" stroke-width="3" stroke-linejoin="round"/><polygon points="725,632 713.2941876694152,637.654551943446 713.2941876694152,626.345448056554" fill="#357c78"/><rect x="730" y="580" width="190" height="105" rx="15" fill="#e9f3ef" stroke="#e7dacc" stroke-width="2"/><text x="825.0" y="595" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">Top-K 片段</text><text x="825.0" y="637" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">原文 + 来源</text><polyline points="595,455 595,576" fill="none" stroke="#357c78" stroke-width="3" stroke-linejoin="round"/><polygon points="595,576 589.345448056554,564.2941876694152 600.654551943446,564.2941876694152" fill="#357c78"/><text x="612" y="468" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">读索引</text><polyline points="135,685 135,735 380,735 380,785" fill="none" stroke="#bf682a" stroke-width="3" stroke-linejoin="round"/><polygon points="380,785 374.345448056554,773.2941876694152 385.654551943446,773.2941876694152" fill="#bf682a"/><text x="145" y="699" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">原始问题</text><polyline points="825,685 825,755 580,755 580,785" fill="none" stroke="#357c78" stroke-width="3" stroke-linejoin="round"/><polygon points="580,785 574.345448056554,773.2941876694152 585.654551943446,773.2941876694152" fill="#357c78"/><text x="692" y="711" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">检索资料</text><rect x="80" y="790" width="800" height="100" rx="15" fill="#faecdc" stroke="#e7dacc" stroke-width="2"/><text x="480.0" y="805" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">Prompt：问题 + 资料 + 回答要求</text><text x="480.0" y="847" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">Augmentation · 增强本次上下文，不在此修改模型参数</text><polyline points="480,890 480,924" fill="none" stroke="#bf682a" stroke-width="3" stroke-linejoin="round"/><polygon points="480,924 474.345448056554,912.2941876694152 485.654551943446,912.2941876694152" fill="#bf682a"/><rect x="230" y="930" width="500" height="95" rx="15" fill="#e9f3ef" stroke="#e7dacc" stroke-width="2"/><text x="480.0" y="945" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">LLM 阅读与生成</text><text x="480.0" y="987" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">Generation · 根据提供的上下文组织答案</text><polyline points="480,1025 480,1059" fill="none" stroke="#357c78" stroke-width="3" stroke-linejoin="round"/><polygon points="480,1059 474.345448056554,1047.2941876694151 485.654551943446,1047.2941876694151" fill="#357c78"/><rect x="230" y="1065" width="500" height="90" rx="15" fill="#faecdc" stroke="#e7dacc" stroke-width="2"/><text x="480.0" y="1080" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">答案 + 对应出处</text><text x="480.0" y="1122" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">回到原文检查证据是否支持论断</text><text x="40" y="1201" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">MonkeyDream · RAG 第一课 · 概念示意</text></svg>