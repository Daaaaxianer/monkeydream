<svg xmlns="http://www.w3.org/2000/svg" width="960" height="860" viewBox="0 0 960 860" role="img" aria-labelledby="title desc"><title id="title">RAG 答错时，先检查哪一步？</title><desc id="desc">先看检索结果，再核对模型是否忠实地使用了证据。</desc><rect x="0" y="0" width="960" height="860" rx="0" fill="#fffcf8" stroke="#fffcf8" stroke-width="2"/><text x="40" y="35" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">RAG 答错时，先检查哪一步？</text><text x="40" y="89" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">先看检索结果，再核对模型是否忠实地使用了证据。</text><rect x="30" y="150" width="435" height="545" rx="15" fill="#ffffff" stroke="#e7dacc" stroke-width="2"/><text x="58" y="174" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">检索失败</text><rect x="495" y="150" width="435" height="545" rx="15" fill="#ffffff" stroke="#e7dacc" stroke-width="2"/><text x="523" y="174" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">生成失败</text><rect x="50" y="246" width="395" height="76" rx="15" fill="#faecdc" stroke="#e7dacc" stroke-width="2"/><text x="247" y="268" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#bf682a" text-anchor="middle" dominant-baseline="text-before-edge">知识库中有正确证据</text><polyline points="247,322 247,370" fill="none" stroke="#bf682a" stroke-width="3" stroke-linejoin="round"/><polygon points="247,370 241.345448056554,358.2941876694152 252.654551943446,358.2941876694152" fill="#bf682a"/><rect x="515" y="246" width="395" height="76" rx="15" fill="#e9f3ef" stroke="#e7dacc" stroke-width="2"/><text x="712" y="268" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#357c78" text-anchor="middle" dominant-baseline="text-before-edge">已获得充分且正确的证据</text><polyline points="712,322 712,370" fill="none" stroke="#357c78" stroke-width="3" stroke-linejoin="round"/><polygon points="712,370 706.345448056554,358.2941876694152 717.654551943446,358.2941876694152" fill="#357c78"/><rect x="50" y="380" width="395" height="76" rx="15" fill="#faecdc" stroke="#e7dacc" stroke-width="2"/><text x="247" y="402" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#bf682a" text-anchor="middle" dominant-baseline="text-before-edge">未召回 / 排名过低</text><polyline points="247,456 247,504" fill="none" stroke="#bf682a" stroke-width="3" stroke-linejoin="round"/><polygon points="247,504 241.345448056554,492.2941876694152 252.654551943446,492.2941876694152" fill="#bf682a"/><rect x="515" y="380" width="395" height="76" rx="15" fill="#e9f3ef" stroke="#e7dacc" stroke-width="2"/><text x="712" y="402" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#357c78" text-anchor="middle" dominant-baseline="text-before-edge">模型误读 / 遗漏条件</text><polyline points="712,456 712,504" fill="none" stroke="#357c78" stroke-width="3" stroke-linejoin="round"/><polygon points="712,504 706.345448056554,492.2941876694152 717.654551943446,492.2941876694152" fill="#357c78"/><rect x="50" y="514" width="395" height="76" rx="15" fill="#faecdc" stroke="#e7dacc" stroke-width="2"/><text x="247" y="536" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#bf682a" text-anchor="middle" dominant-baseline="text-before-edge">输入上下文缺少答案</text><rect x="515" y="514" width="395" height="76" rx="15" fill="#e9f3ef" stroke="#e7dacc" stroke-width="2"/><text x="712" y="536" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#357c78" text-anchor="middle" dominant-baseline="text-before-edge">证据足够，答案仍然错误</text><text x="59" y="621" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">先查：解析、切块、召回与过滤</text><text x="524" y="621" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">先查：提示、理解与生成过程</text><text x="40" y="725" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">检索评价：有没有找到证据？  生成评价：有没有据此答对？</text><text x="40" y="767" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">还要核对知识库质量；实际系统可能同时出现多种问题。</text><text x="40" y="821" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">MonkeyDream · RAG 第一课 · 概念示意</text></svg>