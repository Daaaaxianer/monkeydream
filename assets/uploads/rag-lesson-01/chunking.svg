<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title desc"><title id="title">为什么切块时要保留重叠？</title><desc id="desc">示意参数：每块 100 tokens，相邻重叠 20 tokens。</desc><rect x="0" y="0" width="960" height="800" rx="0" fill="#fffcf8" stroke="#fffcf8" stroke-width="2"/><text x="40" y="35" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">为什么切块时要保留重叠？</text><text x="40" y="89" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">示意参数：每块 100 tokens，相邻重叠 20 tokens。</text><text x="40" y="150" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">原文：关键句恰好跨过第 100 个 token</text><rect x="70" y="205" width="803" height="37" rx="5" fill="#e9f3ef" stroke="#e9f3ef" stroke-width="2"/><rect x="361" y="199" width="47" height="49" rx="5" fill="#e6b185" stroke="#bf682a" stroke-width="2"/><polyline points="378,187 378,680" fill="none" stroke="#bf682a" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 7"/><text x="70" y="252" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">1</text><text x="407" y="252" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">95–110：同一句话</text><text x="845" y="252" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">260</text><text x="70" y="296" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">Chunk 1 · tokens 1–100</text><rect x="70" y="335" width="307" height="51" rx="8" fill="#faecdc" stroke="#bf682a" stroke-width="2"/><text x="318" y="421" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">Chunk 2 · tokens 81–180</text><rect x="318" y="460" width="307" height="51" rx="8" fill="#faecdc" stroke="#bf682a" stroke-width="2"/><text x="566" y="546" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">Chunk 3 · tokens 161–260</text><rect x="566" y="585" width="307" height="51" rx="8" fill="#faecdc" stroke="#bf682a" stroke-width="2"/><rect x="318" y="335" width="59" height="51" rx="8" fill="#e6b185" stroke="#bf682a" stroke-width="2"/><rect x="318" y="460" width="59" height="51" rx="8" fill="#e6b185" stroke="#bf682a" stroke-width="2"/><rect x="566" y="460" width="59" height="51" rx="8" fill="#e6b185" stroke="#bf682a" stroke-width="2"/><rect x="566" y="585" width="59" height="51" rx="8" fill="#e6b185" stroke="#bf682a" stroke-width="2"/><polyline points="361,401 408,401" fill="none" stroke="#357c78" stroke-width="5" stroke-linejoin="round"/><text x="424" y="383" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">第二块完整包含关键句</text><text x="40" y="691" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">重叠减少边界信息丢失；仍应照顾句子、段落和表格结构。</text><text x="40" y="761" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">MonkeyDream · RAG 第一课 · 概念示意</text></svg>