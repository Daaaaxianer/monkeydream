<svg xmlns="http://www.w3.org/2000/svg" width="960" height="990" viewBox="0 0 960 990" role="img" aria-labelledby="title desc"><title id="title">TPM：先校正长度，再归一到百万</title><desc id="desc">三个转录本构成整个示例样本；有效长度以 kb 计。</desc><rect x="0" y="0" width="960" height="990" rx="0" fill="#fffcf8" stroke="#fffcf8" stroke-width="2"/><text x="40" y="35" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">TPM：先校正长度，再归一到百万</text><text x="40" y="89" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">三个转录本构成整个示例样本；有效长度以 kb 计。</text><rect x="30" y="145" width="900" height="462" rx="15" fill="#ffffff" stroke="#e7dacc" stroke-width="2"/><text x="50" y="168" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">转录本</text><text x="240" y="168" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">片段量 ÷ 有效长度</text><text x="550" y="168" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">长度校正值</text><text x="770" y="168" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">TPM</text><text x="65" y="250" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">A</text><text x="240" y="250" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">400 ÷ 2</text><polyline points="425,273 515,273" fill="none" stroke="#786e64" stroke-width="3" stroke-linejoin="round"/><polygon points="515,273 503.2941876694152,278.654551943446 503.2941876694152,267.345448056554" fill="#786e64"/><text x="575" y="250" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">200</text><text x="755" y="250" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">400,000</text><rect x="240" y="297" width="84" height="11" rx="2" fill="#bf682a" stroke="#bf682a" stroke-width="2"/><text x="65" y="365" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">B</text><text x="240" y="365" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">100 ÷ 1</text><polyline points="425,388 515,388" fill="none" stroke="#786e64" stroke-width="3" stroke-linejoin="round"/><polygon points="515,388 503.2941876694152,393.654551943446 503.2941876694152,382.345448056554" fill="#786e64"/><text x="575" y="365" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">100</text><text x="755" y="365" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">200,000</text><rect x="240" y="412" width="42" height="11" rx="2" fill="#357c78" stroke="#357c78" stroke-width="2"/><text x="65" y="480" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">C</text><text x="240" y="480" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">800 ÷ 4</text><polyline points="425,503 515,503" fill="none" stroke="#786e64" stroke-width="3" stroke-linejoin="round"/><polygon points="515,503 503.2941876694152,508.654551943446 503.2941876694152,497.345448056554" fill="#786e64"/><text x="575" y="480" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">200</text><text x="755" y="480" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">400,000</text><rect x="240" y="527" width="168" height="11" rx="2" fill="#bf682a" stroke="#bf682a" stroke-width="2"/><polyline points="480,607 480,642" fill="none" stroke="#bf682a" stroke-width="3" stroke-linejoin="round"/><polygon points="480,642 474.345448056554,630.2941876694152 485.654551943446,630.2941876694152" fill="#bf682a"/><rect x="100" y="649" width="760" height="100" rx="15" fill="#e9f3ef" stroke="#e7dacc" stroke-width="2"/><text x="480.0" y="664" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">校正值总和 = 200 + 100 + 200 = 500</text><text x="480.0" y="706" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">每条转录本的 TPM = 该条校正值 / 500 × 1,000,000</text><rect x="40" y="790" width="880" height="112" rx="15" fill="#faecdc" stroke="#e7dacc" stroke-width="2"/><text x="480" y="807" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#bf682a" text-anchor="middle" dominant-baseline="text-before-edge">C 的片段量是 A 的 2 倍，有效长度也是 2 倍</text><text x="480" y="850" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">校正后 A、C 相同：各占 40%，TPM 均为 400,000</text><text x="40" y="951" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">MonkeyDream · SUPPA2 学习笔记 · 结构与数字均为示意</text></svg>