<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" role="img" aria-labelledby="title desc"><title id="title">从比例变化，到统计证据</title><desc id="desc">先检查可计算性；效应量、统计检验与校正范围分别报告。</desc><rect x="0" y="0" width="960" height="920" rx="0" fill="#fffcf8" stroke="#fffcf8" stroke-width="2"/><text x="40" y="35" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">从比例变化，到统计证据</text><text x="40" y="89" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">先检查可计算性；效应量、统计检验与校正范围分别报告。</text><rect x="110" y="155" width="740" height="93" rx="15" fill="#faecdc" stroke="#e7dacc" stroke-width="2"/><text x="480.0" y="170" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">每样本 PSI 与缺失检查</text><text x="480.0" y="212" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">分母丰度、过滤阈值、转录本 ID、样本对应</text><polyline points="480,248 480,280" fill="none" stroke="#bf682a" stroke-width="3" stroke-linejoin="round"/><polygon points="480,280 474.345448056554,268.2941876694152 485.654551943446,268.2941876694152" fill="#bf682a"/><rect x="110" y="286" width="740" height="93" rx="15" fill="#e9f3ef" stroke="#e7dacc" stroke-width="2"/><text x="480.0" y="301" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">ΔPSI：第二条件 − 第一条件</text><text x="480.0" y="343" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">方向回到事件分子定义；0.45 表示 45 个百分点</text><polyline points="480,379 480,411" fill="none" stroke="#357c78" stroke-width="3" stroke-linejoin="round"/><polygon points="480,411 474.345448056554,399.2941876694152 485.654551943446,399.2941876694152" fill="#357c78"/><rect x="110" y="417" width="740" height="93" rx="15" fill="#faecdc" stroke="#e7dacc" stroke-width="2"/><text x="480.0" y="432" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">经验检验 → 原始 p 值</text><text x="480.0" y="474" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">比较表达相近事件的重复波动；不是从差值直接查表</text><polyline points="480,510 480,540 252,540 252,572" fill="none" stroke="#bf682a" stroke-width="3" stroke-linejoin="round"/><polygon points="252,572 246.345448056554,560.2941876694152 257.654551943446,560.2941876694152" fill="#bf682a"/><polyline points="480,540 708,540 708,572" fill="none" stroke="#357c78" stroke-width="3" stroke-linejoin="round"/><polygon points="708,572 702.345448056554,560.2941876694152 713.654551943446,560.2941876694152" fill="#357c78"/><rect x="40" y="578" width="425" height="118" rx="15" fill="#faecdc" stroke="#e7dacc" stroke-width="2"/><text x="252.5" y="593" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">基因内 BH</text><text x="252.5" y="635" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">-gc：每个基因各自作为家族</text><rect x="495" y="578" width="425" height="118" rx="15" fill="#e9f3ef" stroke="#e7dacc" stroke-width="2"/><text x="707.5" y="593" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">同一比较的全事件 BH</text><text x="707.5" y="635" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">从有效原始 p 值另行统一校正</text><text x="480" y="723" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#bf682a" text-anchor="middle" dominant-baseline="text-before-edge">两种校正范围不等价；不要对调整后的 p 再做一次 BH</text><rect x="40" y="785" width="880" height="68" rx="15" fill="#ffffff" stroke="#e7dacc" stroke-width="2"/><text x="480" y="802" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#40372f" text-anchor="middle" dominant-baseline="text-before-edge">结合预设效应量门槛、重复一致性与后续生物学验证</text><text x="40" y="881" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">MonkeyDream · SUPPA2 学习笔记 · 教学示意</text></svg>