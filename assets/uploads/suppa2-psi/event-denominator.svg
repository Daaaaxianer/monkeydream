start" dominant-baseline="text-before-edge">分子 + 分母</text><polyline points="325,408 400,408" fill="none" stroke="#e7dacc" stroke-width="4" stroke-linejoin="round"/><polyline points="475,408 550,408" fill="none" stroke="#e7dacc" stroke-width="4" stroke-linejoin="round"/><rect x="250" y="385" width="75" height="46" rx="5" fill="#e9f3ef" stroke="#357c78" stroke-width="2"/><rect x="400" y="385" width="75" height="46" rx="5" fill="#bf682a" stroke="#bf682a" stroke-width="2"/><rect x="550" y="385" width="75" height="46" rx="5" fill="#e9f3ef" stroke="#357c78" stroke-width="2"/><text x="840" y="388" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">10</text><text x="45" y="509" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">T3</text><text x="45" y="548" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">仅分母</text><polyline points="325,528 550,528" fill="none" stroke="#e7dacc" stroke-width="4" stroke-linejoin="round"/><polyline points="625,528 700,528" fill="none" stroke="#e7dacc" stroke-width="4" stroke-linejoin="round"/><rect x="250" y="505" width="75" height="46" rx="5" fill="#e9f3ef" stroke="#357c78" stroke-width="2"/><rect x="550" y="505" width="75" height="46" rx="5" fill="#e9f3ef" stroke="#357c78" stroke-width="2"/><rect x="700" y="505" width="75" height="46" rx="5" fill="#e9f3ef" stroke="#357c78" stroke-width="2"/><text x="840" y="508" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">20</text><text x="45" y="629" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#78