<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" role="img" aria-labelledby="title desc"><title id="title">PSI 的分母，究竟包含谁？</title><desc id="desc">GeneA 的 E2 跳跃事件：先按局部结构划定转录本集合。</desc><rect x="0" y="0" width="960" height="1000" rx="0" fill="#fffcf8" stroke="#fffcf8" stroke-width="2"/><text x="40" y="35" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">PSI 的分母，究竟包含谁？</text><text x="40" y="89" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">GeneA 的 E2 跳跃事件：先按局部结构划定转录本集合。</text><text x="240" y="146" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">5′</text><polyline points="280,160 686,160" fill="none" stroke="#786e64" stroke-width="3" stroke-linejoin="round"/><polygon points="686,160 674.2941876694152,165.654551943446 674.2941876694152,154.345448056554" fill="#786e64"/><text x="710" y="146" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">3′</text><text x="287" y="190" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">E1</text><text x="437" y="190" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">E2</text><text x="587" y="190" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#786e64" text-anchor="middle" dominant-baseline="text-before-edge">E3</text><text x="737" y="190" font-family="Microsoft YaH