<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1030" viewBox="0 0 960 1030" role="img" aria-labelledby="title desc"><title id="title">七类可变剪接事件 · 2 / 2</title><desc id="desc">再看互斥外显子，以及转录本首、末端的选择。</desc><rect x="0" y="0" width="960" height="1030" rx="0" fill="#fffcf8" stroke="#fffcf8" stroke-width="2"/><text x="40" y="35" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">七类可变剪接事件 · 2 / 2</text><text x="40" y="89" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">再看互斥外显子，以及转录本首、末端的选择。</text><text x="40" y="139" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">F1：PSI 分子形式    F2：另一形式；橙色标出可变区域</text><text x="40" y="177" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">统一画正链 5′ → 3′；横线为剪接连接，结构不按比例绘制</text><rect x="28" y="228" width="904" height="236" rx="15" fill="#ffffff" stroke="#e7dacc" stroke-width="2"/><text x="46" y="242" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">MX  互斥外显子</text><text x="46" y="304" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">F1</text><polyline points="310,320 367.5,301 425,320" fill="none" stroke="#786e64" stroke-width="2" stroke-linejoin="round"/><polyline points="485,320 610.0,301 735,320" fill="none" stroke="#786e64" stroke-width="2" stroke-linejoin="round"/><rect x="250" y="305" width="60" height="30" rx="4" fill="#e9f3ef" stroke="#357c78" stroke-width="2"/><rect x="425" y="305" width="60" height="30" rx="4" fill="#bf682a" stroke="#bf682a" stroke-width="2"/><rect x="735" y="305" width="60" height="30" rx="4" fill="#e9f3ef" stroke="#357c78" stroke-width="2"/><text x="46" y="370" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">F2</text><polyline points="310,386 440.0,367 570,386" fill="none" stroke="#786e64" stroke-width="2" stroke-linejoin="round"/><polyline points="630,386 682.5,367 735,386" fill="none" stroke="#786e64" stroke-width="2" stroke-linejoin="round"/><rect x="250" y="371" width="60" height="30" rx="4" fill="#e9f3ef" stroke="#357c78" stroke-width="2"/><rect x="570" y="371" width="60" height="30" rx="4" fill="#bf682a" stroke="#bf682a" stroke-width="2"/><rect x="735" y="371" width="60" height="30" rx="4" fill="#e9f3ef" stroke="#357c78" stroke-width="2"/><text x="46" y="423" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">两种局部形式选择不同内部外显子；F1 取较小起始坐标。</text><rect x="28" y="478" width="904" height="236" rx="15" fill="#ffffff" stroke="#e7dacc" stroke-width="2"/><text x="46" y="492" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">AF  可变第一外显子</text><text x="46" y="554" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">F1</text><polyline points="330,570 522.5,551 715,570" fill="none" stroke="#786e64" stroke-width="2" stroke-linejoin="round"/><rect x="250" y="555" width="80" height="30" rx="4" fill="#bf682a" stroke="#bf682a" stroke-width="2"/><rect x="715" y="555" width="80" height="30" rx="4" fill="#e9f3ef" stroke="#357c78" stroke-width="2"/><text x="46" y="620" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">F2</text><polyline points="545,636 630.0,617 715,636" fill="none" stroke="#786e64" stroke-width="2" stroke-linejoin="round"/><rect x="465" y="621" width="80" height="30" rx="4" fill="#bf682a" stroke="#bf682a" stroke-width="2"/><rect x="715" y="621" width="80" height="30" rx="4" fill="#e9f3ef" stroke="#357c78" stroke-width="2"/><text x="46" y="673" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">首外显子不同，共用下游外显子；F1 对应较长内含子。</text><rect x="28" y="728" width="904" height="236" rx="15" fill="#ffffff" stroke="#e7dacc" stroke-width="2"/><text x="46" y="742" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#40372f" text-anchor="start" dominant-baseline="text-before-edge">AL  可变末外显子</text><text x="46" y="804" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#bf682a" text-anchor="start" dominant-baseline="text-before-edge">F1</text><polyline points="330,820 522.5,801 715,820" fill="none" stroke="#786e64" stroke-width="2" stroke-linejoin="round"/><rect x="250" y="805" width="80" height="30" rx="4" fill="#e9f3ef" stroke="#357c78" stroke-width="2"/><rect x="715" y="805" width="80" height="30" rx="4" fill="#bf682a" stroke="#bf682a" stroke-width="2"/><text x="46" y="870" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#357c78" text-anchor="start" dominant-baseline="text-before-edge">F2</text><polyline points="330,886 415.0,867 500,886" fill="none" stroke="#786e64" stroke-width="2" stroke-linejoin="round"/><rect x="250" y="871" width="80" height="30" rx="4" fill="#e9f3ef" stroke="#357c78" stroke-width="2"/><rect x="500" y="871" width="80" height="30" rx="4" fill="#bf682a" stroke="#bf682a" stroke-width="2"/><text x="46" y="923" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">共用上游外显子，末外显子不同；F1 对应较长内含子。</text><text x="40" y="991" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#786e64" text-anchor="start" dominant-baseline="text-before-edge">MonkeyDream · SUPPA2 学习笔记 · 结构与数字均为示意</text></svg>